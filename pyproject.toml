[project]
name = "pie"
version = "0.1.0"
description = "Predicting Interpolating Ensembles (PIE)"
authors = [
  { name = "Shukla Group (UIUC)", email = "diwakar@illinois.edu" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "biotite",
    "mdtraj",
    "scipy",
    "biopython",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pie*"]

[project.scripts]
run_pie = "pie.run_pie:main"