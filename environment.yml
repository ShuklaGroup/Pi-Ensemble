name: pie
channels:
  - conda-forge
dependencies:
  - python=3.12
  - git
  - pip
  - setuptools
  - wheel
  - pip:
      - --index-url=https://download.pytorch.org/whl/cu130
      - --extra-index-url=https://pypi.org/simple
      - torch==2.11.0
      - torchvision==0.26.0
      - numpy<2
      - mdtraj<1.11
      - .
      - pyyaml
      - requests
      - httpx
      - pandas
      - python-Levenshtein
      - openmm
      - boltz==2.2.0
      - esm==3.4.1.post1
      - cuequivariance==0.12.0
      - cuequivariance-torch==0.12.0
      - cuequivariance-ops-cu13==0.12.0
      - cuequivariance-ops-torch-cu13==0.12.0
